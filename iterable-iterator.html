<script>
    class CounterIteratorResult {
        constructor (value, done) {
            this.value = value;
            this.done = done;
        }


    }

    class CounterIterator {
        constructor (value, max) {
            this.value = value;
            this.max = max;
        }

        next(){
            try {
                if (this.value > this.max) {
                    return new CounterIteratorResult(this.value, true);
                } else {
                    return new CounterIteratorResult(this.value, false);
                }
            } finally {
                this.value++;
            }
        }
    }

    class Counter {
        constructor (value, max) {
            this.value = value;
            this.max = max;
        }

        [Symbol.iterator]() {
            return new CounterIterator(this.value, this.max);
        }
    }

    const ulang = new Counter(3, 5);
    for  (const element of ulang) {
        console.info(element);
    }

    // intinya : setiap next() dipanggil, iterator mengecek angka saat ini, mengembalikan hasil, lalu menaikkan value satu angka. Loop berhenti ketika value sudah melewati max

</script>
