<!DOCTYPE html>

<script>
    class Employee {
        constructor (name) {
            this.name = name;
        }

        sayHello (name) {
            console.info(`Hello ${name}, my name is Employee ${this.name}`)    
        }
    }
    
    class Manager extends Employee { 
        constructor (name, lastName){
            super (name); // wajib panggil constructor sebelumnya di class employee
            this.lastName = lastName
        }
        sayHello(name) { 
            console.info(`Hello ${name}, my name is Manager ${this.name} ${ this.lastName}`)    
        }
    }

    const employee = new Employee("Rio");
    console.info(employee);
    employee.sayHello("bedul")
    
    const manager = new Manager("Rio", "Achyar"); // tambah value di super constructor
    console.info(manager);
    manager.sayHello("wancoy")
</script>
