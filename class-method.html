<script>
    class Person {
        constructor(name){ 
            this.name = name; 
        }

        sayHello (name) { // best practice cara membuat method di class yang langsung di tambahkan ke prototype
            console.info(`Halo ${name}, my name is ${this.name}`)
        }
    }

    const rio = new Person("Rio");
    rio.sayHello("jempol");
    console.info(rio)
    console.info(rio.name)
</script>
