<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>
    class Employee {
        constructor (name) {
            this.name = name;
        }

        sayHello (name) {
            console.info(`Hello ${name}, my name is Employee ${this.name}`)    
        }
    }
    
    class Manager extends Employee { // cara membuat inheritance class  
        sayHello(name) { // cara menggunakan inheritance function class
            console.info(`Hello ${name}, my name is Manager ${this.name}`)    
        }
    }

    const employee = new Employee("Rio");
    console.info(employee);
    employee.sayHello("bedul")
    
    const manager = new Manager("Achyar");
    console.info(manager);
    manager.sayHello("wancoy")
</script>
</html>
