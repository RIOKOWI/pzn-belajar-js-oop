<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    
</body>
<script>
    function OrangPremium() { // best practice nya pakai kapital di depan setiap kata
        this.namaDepan = ""; // membuat property
        this.namaBelakang = "";
        this.sayHello = function (name) { // membuat method di constructor function
            console.info(`Hello ${name}, my name is ${this.namaDepan}`);
        }
    }

    const rio = new OrangPremium(); // cara membuat object
    rio.namaDepan = "Rio"; // tambah value property
    rio.namaBelakang = "Achyar";
    rio.sayHello("bedul"); // panggil method di constructor function
    
    const coy = new OrangPremium();
    coy.namaDepan = "Wanda";
    coy.namaBelakang = "Wancoy";
    coy.sayHello("rico");

    console.log(rio);
    console.log(coy);
</script>
</html>
