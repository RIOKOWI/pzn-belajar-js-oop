<script>
    class Math {
        static sum(...numbers){ // cara membuat static method
            if (numbers.length == 0) { // cara membuat throw error
                throw new Error ("harus lebih dari 0")
            }

            let total = 0;
            for (const number of numbers){
                total += number
            }
            return total;
        }
    }

    const error = Math.sum();
    const sum = Math.sum(1,1,1,1,1,1,1); // cara akses static method
    console.info(sum)
</script>
