<script>
    class Math {
        static sum(...numbers){ 
            if (numbers.length == 0) { // cara membuat throw error
                throw new Error ("harus lebih dari 0")
            }

            let total = 0;
            for (const number of numbers){
                total += number
            }
            return total;
        }
    }

    try { // cara membuat error handling
        console.info(Math.sum());
        console.info("Rio");
    } catch (error) {
        console.info(`Terjadi error : ${error.message}`); // tampilkan pesan error
    }

    console.info("rio")
</script>
