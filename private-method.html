<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<body>
    
</body>
<script>
    class Person {
        say(name) {
            if (name){
                this.#sayWithName(name); // panggil private method
            }
            else {
                this.#sayWithoutName();  // panggil private method
            }
        }

        #sayWithoutName(){ // cara membuat private method
            console.info("Hello");
        }

        #sayWithName(name) { // cara membuat private method
            console.info(`Hello ${name}`);
        }
    }

    const rio = new Person();
    rio.say();
    rio.say("rio");
</script>
</html>
