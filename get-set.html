<script>
    class Person {
        constructor (firstName, lastName){
            this.firstName = firstName;
            this.lastName = lastName;
        }

        get fullName () { // cara membuat getter
            return `${this.firstName} ${this.lastName}`
        }

        set fullName(value){ // cara membuat setter
            const result = value.split(" ");
            this.firstName = result[0];
            this.lastName = result[0];
        }
    }


    const rio = new Person("Rio", "Achyar");
    console.info(rio);
    console.info(rio.fullName);
    
    rio.fullName = "Wanda hara";
    console.info(rio);
</script>
